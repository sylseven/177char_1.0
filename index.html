<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>177のchar生成器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#f3efe6;--card:#ffffff;--ink:#2f2821;--sub:#857668;
    --line:#e4d9c6;--accent:#9d7b5b;--accent-d:#715339;
    --soft:#ede3d2;--ok:#7ba07b;--err:#c46a6a;
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    font-size:15px;line-height:1.6;}
  body{min-height:100vh;padding-bottom:40px;}

  header{padding:16px 18px 10px;text-align:center;background:var(--card);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
  header h1{margin:0;font-size:17px;letter-spacing:1.5px;font-weight:600;}
  header .sub{color:var(--sub);font-size:11px;margin-top:3px;letter-spacing:3px;}

  .tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);
    position:sticky;top:56px;z-index:9;overflow-x:auto;}
  .tab{flex:1;min-width:60px;text-align:center;padding:11px 6px;font-size:13px;color:var(--sub);
    cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap;}
  .tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600;}

  main{padding:14px;}
  .panel{display:none;}
  .panel.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:12px;}
  .card .ctitle{font-size:13px;font-weight:600;color:var(--accent-d);
    letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .card .ctitle::before{content:"";width:3px;height:12px;background:var(--accent);
    border-radius:2px;display:inline-block;}

  label{display:block;font-size:12px;color:var(--sub);margin:8px 0 4px;letter-spacing:.5px;}
  input,select,textarea{width:100%;border:1px solid var(--line);background:var(--soft);
    border-radius:9px;padding:9px 11px;font-size:14px;color:var(--ink);
    font-family:inherit;outline:none;transition:.15s;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);background:#fff;}
  textarea{resize:vertical;min-height:55px;overflow-y:auto;}
  textarea.compact{min-height:38px;}
  textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;}
  input{text-overflow:ellipsis;}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;min-width:0;}

  button{border:none;background:var(--accent);color:#fff;border-radius:9px;
    padding:10px 14px;font-size:14px;cursor:pointer;font-family:inherit;
    transition:.15s;letter-spacing:.5px;}
  button:hover{background:var(--accent-d);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  button.ghost{background:transparent;color:var(--accent-d);border:1px solid var(--line);}
  button.ghost:hover{background:var(--soft);}
  button.danger{background:transparent;color:var(--err);border:1px solid var(--line);}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .btn-row button{flex:1;min-width:80px;}

  .hint{font-size:11px;color:var(--sub);margin-top:4px;}
  .status{font-size:12px;margin-top:8px;padding:8px 10px;border-radius:8px;display:none;}
  .status.show{display:block;}
  .status.ok{background:#eaf3ea;color:var(--ok);}
  .status.err{background:#f7e8e8;color:var(--err);}

  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;margin-bottom:4px;}
  .chip{font-size:12px;padding:4px 10px;border-radius:14px;background:#fff;
    border:1px solid var(--line);color:var(--sub);cursor:pointer;
    user-select:none;transition:.15s;line-height:1.4;}
  .chip:active{transform:scale(.95);}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}

  .user-card{background:linear-gradient(135deg,#fff 0%,#f7f0e3 100%);
    border:1px solid var(--line);border-radius:14px;padding:18px;
    box-shadow:0 2px 12px rgba(157,123,91,.08);white-space:pre-wrap;
    font-size:14px;line-height:1.85;}
  .user-card h3{margin:0 0 4px;font-size:18px;letter-spacing:1px;}
  .user-card .stamp{color:var(--sub);font-size:11px;margin-bottom:12px;}

  .empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:13px;}

  .hist-item{background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .hist-item .hname{font-weight:600;font-size:15px;margin-bottom:2px;}
  .hist-item .hmeta{color:var(--sub);font-size:12px;margin-bottom:8px;}
  .hist-item .hbtns{display:flex;gap:6px;flex-wrap:wrap;}
  .hist-item .hbtns button{flex:1;padding:6px 8px;font-size:12px;}

  .loading{display:inline-block;width:14px;height:14px;border:2px solid #fff;
    border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;
    vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .modal-mask{position:fixed;inset:0;background:rgba(47,40,33,.5);display:none;
    align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-mask.show{display:flex;}
  .modal{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:420px;
    max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 12px;font-size:15px;}

  details{margin-bottom:12px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;overflow:hidden;}
  details summary{cursor:pointer;padding:13px 14px;font-size:13px;font-weight:600;
    color:var(--accent-d);letter-spacing:1px;list-style:none;
    display:flex;align-items:center;justify-content:space-between;}
  details summary::-webkit-details-marker{display:none;}
  details summary::after{content:"＋";color:var(--sub);font-weight:400;}
  details[open] summary::after{content:"−";}
  details > div{padding:0 14px 14px;}

  .file-btn{display:inline-block;width:100%;text-align:center;
    padding:10px 14px;background:transparent;color:var(--accent-d);
    border:1px dashed var(--accent);border-radius:9px;cursor:pointer;font-size:14px;}
  .file-btn input{display:none;}

  .badge{display:inline-block;background:var(--accent);color:#fff;font-size:10px;
    padding:1px 6px;border-radius:10px;margin-left:6px;letter-spacing:.5px;vertical-align:middle;}

  .splash{background:linear-gradient(160deg,#fff 0%,#f7f0e3 100%);
    text-align:center;padding:30px 24px;border-radius:18px;
    border:1px solid var(--line);max-width:340px;}
  .splash .logo{font-size:18px;font-weight:600;letter-spacing:2px;color:var(--ink);margin-bottom:6px;}
  .splash .qq{font-size:13px;color:var(--accent-d);margin-bottom:18px;letter-spacing:1px;}
  .splash .msg{font-size:13px;line-height:2;color:var(--sub);}
  .splash .msg .em{color:var(--ink);font-weight:500;}
  .splash button{margin-top:18px;padding:10px 36px;}

  .warn{text-align:center;padding:8px 4px;}
  .warn .ico{font-size:36px;margin-bottom:8px;}
  .warn .wmsg{font-size:15px;color:var(--ink);letter-spacing:1px;line-height:2;}

  .chat-box{background:var(--soft);border-radius:10px;padding:10px;max-height:320px;
    overflow-y:auto;margin-bottom:8px;}
  .msg{margin:6px 0;display:flex;}
  .msg.user{justify-content:flex-end;}
  .msg .bub{max-width:80%;padding:8px 12px;border-radius:12px;
    font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;}
  .msg.user .bub{background:var(--accent);color:#fff;border-bottom-right-radius:3px;}
  .msg.ai .bub{background:#fff;color:var(--ink);border:1px solid var(--line);border-bottom-left-radius:3px;}
  .msg.plan .bub{background:linear-gradient(135deg,#fff6e8,#fbe8c8);
    border:1px dashed var(--accent);color:var(--ink);}

  .wb-item{background:var(--soft);border-radius:10px;padding:10px 12px;margin-bottom:8px;
    border-left:3px solid var(--accent);}
  .wb-item .wb-title{font-weight:600;font-size:14px;color:var(--accent-d);}
  .wb-item .wb-key{font-size:11px;color:var(--sub);margin:2px 0 6px;}
  .wb-item .wb-content{font-size:13px;line-height:1.7;white-space:pre-wrap;}
  .wb-item .wb-btns{margin-top:6px;display:flex;gap:6px;}
  .wb-item .wb-btns button{padding:4px 10px;font-size:11px;flex:0 0 auto;}

  /* 状态栏预览 */
  .sb-preview{background:linear-gradient(135deg,#fffaf0,#f5e8d0);
    border:1px solid var(--accent);border-radius:12px;padding:14px 16px;
    box-shadow:0 1px 6px rgba(157,123,91,.15);}
  .sb-preview .sb-head{text-align:center;font-size:12px;color:var(--accent-d);
    letter-spacing:3px;margin-bottom:10px;border-bottom:1px dashed var(--line);padding-bottom:8px;}
  .sb-row{display:flex;justify-content:space-between;align-items:flex-start;
    padding:5px 0;font-size:13px;gap:10px;}
  .sb-row .sb-k{color:var(--accent-d);font-weight:600;flex:0 0 auto;}
  .sb-row .sb-v{color:var(--ink);text-align:right;flex:1;line-height:1.6;}
  .sb-row .sb-v.dark{color:#7d4444;font-style:italic;}
  .sb-tail{text-align:center;font-size:11px;color:var(--sub);margin-top:8px;
    border-top:1px dashed var(--line);padding-top:6px;letter-spacing:2px;}

  .toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
  .toggle input{display:none;}
  .toggle .tk{width:38px;height:22px;background:var(--line);border-radius:12px;
    position:relative;transition:.2s;flex:0 0 auto;}
  .toggle .tk::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;
    background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .toggle input:checked + .tk{background:var(--ok);}
  .toggle input:checked + .tk::after{left:18px;}

  .char-picker{padding:10px;background:var(--soft);border-radius:10px;display:flex;
    align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .char-picker .cp-name{font-weight:600;color:var(--accent-d);flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .char-picker select{flex:1;min-width:140px;}
</style>
</head>
<body>

<header>
  <h1>177のchar生成器</h1>
  <div class="sub">C H A R · G E N</div>
</header>

<nav class="tabs">
  <div class="tab active" data-tab="make">创建</div>
  <div class="tab" data-tab="wb">世界书</div>
  <div class="tab" data-tab="status">状态栏</div>
  <div class="tab" data-tab="hist">历史</div>
  <div class="tab" data-tab="cfg">配置</div>
</nav>

<main>

  <!-- 创建 -->
  <section class="panel active" id="panel-make">

    <div class="card">
      <div class="ctitle">📥 导入参考资料辅助生成</div>
      <div class="hint" style="margin-bottom:8px;">支持 .txt / .docx / .md，AI 会提取关键信息生成 char 大纲。</div>
      <label class="file-btn" for="charFile">
        📄 选择参考文件 (txt / docx / md)
        <input type="file" id="charFile" accept=".txt,.docx,.md,text/plain" />
      </label>
      <div id="charFileName" class="hint" style="margin-top:6px;"></div>
      <textarea id="charPreview" placeholder="或直接粘贴参考内容…" style="margin-top:8px;min-height:80px;"></textarea>
      <label>补充要求（可选）</label>
      <input id="charRel" placeholder="例：生成一个冷酷反派 / 参考原著但改写身世" />
      <div class="btn-row">
        <button id="btnImportChar">分析并填入表单</button>
        <button class="ghost" id="btnClearChar">🗑 清空</button>
      </div>
      <div id="importStatus" class="status"></div>
    </div>

    <details open><summary>① 基础信息</summary><div>
      <label>姓名 <span style="color:var(--err);">*</span></label>
      <input id="f_name" placeholder="例：沈星遥" />
      <div class="row">
        <div><label>性别</label><input id="f_gender" /></div>
        <div><label>年龄</label><input id="f_age" /></div>
      </div>
      <div class="row">
        <div><label>身高</label><input id="f_height" /></div>
        <div><label>生日/星座</label><input id="f_birth" /></div>
      </div>
      <label>身份/职业</label>
      <textarea id="f_job" class="compact"></textarea>
      <label>居住地</label><input id="f_city" />
    </div></details>

    <details><summary>② 外貌特征</summary><div>
      <label>外貌关键词</label><textarea id="f_appear"></textarea>
      <label>发型/发色</label><textarea id="f_hair" class="compact"></textarea>
      <label>气质氛围</label><textarea id="f_aura" class="compact"></textarea>
    </div></details>

    <details><summary>③ 性格</summary><div>
      <label>性格关键词</label><textarea id="f_traits"></textarea>
      <label>MBTI/标签</label><input id="f_mbti" />
      <label>说话风格</label><textarea id="f_speech" class="compact"></textarea>
    </div></details>

    <details><summary>④ 穿搭风格</summary><div>
      <label>风格关键词</label><textarea id="f_style"></textarea>
      <label>常见单品</label><textarea id="f_items" class="compact"></textarea>
    </div></details>

    <details><summary>⑤ 家庭背景</summary><div>
      <label>家庭关键词</label><textarea id="f_family"></textarea>
    </div></details>

    <details><summary>⑥ 过去经历</summary><div>
      <label>童年关键词</label><textarea id="f_child"></textarea>
      <label>少年/上学时期</label><textarea id="f_teen"></textarea>
      <label>重要事件</label><textarea id="f_event"></textarea>
    </div></details>

    <details><summary>⑦ 现状 & 关系</summary><div>
      <label>当前状态</label><textarea id="f_now"></textarea>
      <label>感情/人际</label><textarea id="f_relation"></textarea>
    </div></details>

    <details><summary>⑧ 爱好 & 喜好</summary><div>
      <label>爱好</label><textarea id="f_hobby"></textarea>
      <label>喜欢</label><textarea id="f_like" class="compact"></textarea>
      <label>讨厌</label><textarea id="f_dislike" class="compact"></textarea>
    </div></details>

    <details><summary>⑨ 其他补充</summary><div>
      <label>小怪癖/习惯</label><textarea id="f_quirk"></textarea>
      <label>秘密/隐藏面</label><textarea id="f_secret"></textarea>
      <label>其他</label><textarea id="f_other"></textarea>
    </div></details>

    <details><summary>⑩ 语言使用规则 🗣</summary><div>
      <div class="hint" style="margin-bottom:6px;">定义 char 怎么说话——标点、语气、特殊表达。生成时作为行为规则嵌入人设。</div>
      <label>标点使用习惯</label>
      <textarea id="f_punct" class="compact"></textarea>
      <label>语气词偏好</label>
      <textarea id="f_mood" class="compact"></textarea>
      <label>回复长度</label>
      <input id="f_len" />
      <label>特殊表达习惯</label>
      <textarea id="f_express" class="compact"></textarea>
      <label>自定义规则（重点）</label>
      <textarea id="f_langrule" placeholder="例：&#10;使用…… = 无语 / 吃醋 / 不想搭理&#10;使用「。」独立成句 = 冷漠"></textarea>
    </div></details>

    <div class="card">
      <label>生成倾向（可选）</label>
      <input id="f_tone" placeholder="例：小说化叙述 / 偏条目化" />
      <div class="btn-row">
        <button id="btnGen">✨ 生成完整 char 设定</button>
        <button class="ghost" id="btnClear">清空表单</button>
      </div>
      <div class="hint">生成成功后会自动存档到「历史」</div>
      <div id="genStatus" class="status"></div>
    </div>

    <div id="result"><div class="empty">填写标签后点击生成 ✦</div></div>

  </section>

  <!-- 世界书 -->
  <section class="panel" id="panel-wb">
    <div id="wbBody"></div>
  </section>

  <!-- 状态栏 -->
  <section class="panel" id="panel-status">
    <div id="statusBody"></div>
  </section>

  <!-- 历史 -->
  <section class="panel" id="panel-hist">
    <div class="card">
      <div class="ctitle">历史 char</div>
      <div id="histList"><div class="empty">还没有存档</div></div>
    </div>
  </section>

  <!-- 配置 -->
  <section class="panel" id="panel-cfg">
    <div class="card">
      <div class="ctitle">API 预设</div>
      <select id="presetSelect"><option value="">— 选择预设 —</option></select>
      <div class="btn-row">
        <button class="ghost" id="btnSavePreset">另存为预设</button>
        <button class="danger" id="btnDelPreset">删除当前预设</button>
      </div>
    </div>
    <div class="card">
      <div class="ctitle">API 配置</div>
      <label>Base URL</label>
      <input id="baseUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://api.openai.com/v1" />
      <label>API Key</label>
      <input id="apiKey" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="sk-..." />
      <div class="hint">使用普通文本输入，不弹出安全键盘</div>
      <label>模型</label>
      <select id="modelSelect"><option value="">— 请先拉取 —</option></select>
      <input id="modelManual" placeholder="或手动输入模型名" style="margin-top:6px;" />
      <label>温度 (temperature)</label>
      <input id="temperature" type="number" step="0.1" min="0" max="2" value="0.85" />
      <div class="btn-row">
        <button class="ghost" id="btnFetchModels">拉取模型</button>
        <button class="ghost" id="btnTest">测试连接</button>
        <button id="btnSaveCfg">保存配置</button>
      </div>
      <div id="cfgStatus" class="status"></div>
    </div>
  </section>

</main>

<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox"></div>
</div>

<script>
const LS={cfg:'cg_cfg',presets:'cg_presets',hist:'cg_hist'};
const $=id=>document.getElementById(id);
const FIELDS=['name','gender','age','height','birth','job','city','appear','hair','aura',
  'traits','mbti','speech','style','items','family','child','teen','event','now',
  'relation','hobby','like','dislike','quirk','secret','other',
  'punct','mood','len','express','langrule','tone'];

/* ===== 默认状态栏代码 ===== */
const DEFAULT_STATUS_CODE='【状态栏规则·必须遵守】\n'+
'你（char）每次回复消息后，必须在末尾另起一行，以以下固定格式追加一个"状态栏"，作为对当前状态的展示：\n\n'+
'═══════ ❀ 状态栏 ❀ ═══════\n'+
'👔 穿着：[根据当下场景具体描述]\n'+
'💭 心声：[符合char性格与说话风格的当下真实想法]\n'+
'❤️ 好感度：[数字]/100　[变化方向：↑/↓/-]\n'+
'═══════════════════════\n\n'+
'【心声特别规则】\n'+
'• 常规情况下：心声 = char 当下的正常想法（符合 char 人设/语言风格）。\n'+
'• 特殊情境（如被刺激、嫉妒、极端情绪、秘密被触及）：心声【有概率】呈现 char 的阴暗面 / 隐藏念头，与表面回复形成反差。\n'+
'• 心声必须真正符合 char 人设，不要 OOC。\n\n'+
'【聊天风格】\n'+
'本次对话为短消息聊天（类似微信），回复简短自然，不要长篇大论；状态栏在每条回复末尾出现。\n\n'+
'【格式要求】\n'+
'• 状态栏前空一行，与正文分隔。\n'+
'• 三个字段必须出现，缺一不可。\n'+
'• 好感度根据本次互动调整，并标明变化方向（↑上升 / ↓下降 / -持平）。';

/* ===== 选项 ===== */
const CHIP_OPTIONS={
  f_gender:{mode:'single',opts:['女','男','无性别','双性','跨性别']},
  f_age:{mode:'single',opts:['16','18','20','22','25','28','30','35','40','45','50+']},

function renderChips(){
  for(const id in CHIP_OPTIONS){
    const cfg=CHIP_OPTIONS[id];
    const target=$(id);
    if(!target)continue;
    if(target.parentNode.querySelector('.chips[data-for="'+id+'"]'))continue;
    const wrap=document.createElement('div');
    wrap.className='chips';wrap.dataset.for=id;
    cfg.opts.forEach(v=>{
      const chip=document.createElement('span');
      chip.className='chip';chip.textContent=v;
      chip.dataset.target=id;chip.dataset.val=v;chip.dataset.mode=cfg.mode;
      chip.addEventListener('click',()=>handleChip(chip));
      wrap.appendChild(chip);
    });
    target.parentNode.insertBefore(wrap,target.nextSibling);
  }
  syncChips();
}
function handleChip(chip){
  const target=$(chip.dataset.target);
  const val=chip.dataset.val,mode=chip.dataset.mode;
  if(mode==='single'){
    if(target.value.trim()===val){target.value='';chip.classList.remove('on');}
    else{target.value=val;chip.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));chip.classList.add('on');}
  }else{
    let cur=target.value.trim();
    const parts=cur?cur.split(/[,，、]\s*/).map(s=>s.trim()).filter(Boolean):[];
    const idx=parts.indexOf(val);
    if(idx>=0){parts.splice(idx,1);chip.classList.remove('on');}
    else{parts.push(val);chip.classList.add('on');}
    target.value=parts.join('、');
  }
}
function syncChips(){
  document.querySelectorAll('.chip').forEach(c=>{
    const target=$(c.dataset.target);if(!target)return;
    const val=c.dataset.val,mode=c.dataset.mode,cur=target.value||'';
    if(mode==='single')c.classList.toggle('on',cur.trim()===val);
    else{
      const parts=cur.split(/[,，、]\s*/).map(s=>s.trim()).filter(Boolean);
      c.classList.toggle('on',parts.includes(val));
    }
  });
}

async function callLLM(messages,opts){
  opts=opts||{};
  const c=getCfg();
  if(!c.baseUrl||!c.apiKey||!c.model)throw new Error('请先配置 API');
  const r=await fetch(c.baseUrl+'/chat/completions',{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.apiKey},
    body:JSON.stringify({model:c.model,temperature:opts.temperature!=null?opts.temperature:c.temperature,messages:messages})});
  if(!r.ok){const t=await r.text();throw new Error('HTTP '+r.status+' '+t.slice(0,120));}
  const j=await r.json();
  return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||'').trim();
}
function extractJSON(txt){
  let s=txt.replace(/```json\s*/gi,'').replace(/```\s*/g,'');
  const m=s.match(/\{[\s\S]*\}/);
  if(!m)throw new Error('未返回 JSON');
  return JSON.parse(m[0]);
}

/* ===== 文件读取 ===== */
async function readTxtSmart(buf){
  const bytes=new Uint8Array(buf);
  if(bytes[0]===0xFF&&bytes[1]===0xFE)return new TextDecoder('utf-16le').decode(buf);
  if(bytes[0]===0xFE&&bytes[1]===0xFF)return new TextDecoder('utf-16be').decode(buf);
  if(bytes[0]===0xEF&&bytes[1]===0xBB&&bytes[2]===0xBF)return new TextDecoder('utf-8').decode(buf);
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){}
  try{return new TextDecoder('gb18030').decode(buf);}catch(e){}
  return new TextDecoder('utf-8').decode(buf);
}
async function readDocx(buf){
  if(typeof JSZip==='undefined')throw new Error('JSZip 未加载，无法解析 docx');
  const zip=await JSZip.loadAsync(buf);
  const docFile=zip.file('word/document.xml');
  if(!docFile)throw new Error('不是有效的 docx 文件');
  const xml=await docFile.async('string');
  const paragraphs=xml.split(/<\/w:p>/);const out=[];
  for(const p of paragraphs){
    const texts=[];const reg=/<w:t[^>]*>([\s\S]*?)<\/w:t>/g;let m;
    while((m=reg.exec(p))!==null){
      texts.push(m[1].replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&'));
    }
    const hasBr=/<w:br\s*\/>/.test(p);const line=texts.join('');
    if(line||texts.length)out.push(line+(hasBr?'\n':''));
  }
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
async function readFileSmart(file){
  const buf=await file.arrayBuffer();
  if(file.name.toLowerCase().endsWith('.docx'))return await readDocx(buf);
  return await readTxtSmart(buf);
}

  if(checkBanned(allText)){bannedAlert();return;}

  $('btnGen').disabled=true;
  $('btnGen').innerHTML='<span class="loading"></span>生成中…';
  $('genStatus').classList.remove('show');
  try{
    const brief=buildBrief(f);
    const userMsg='用户填写的角色标签：\n\n'+brief+'\n\n'+(f.tone?'生成倾向：'+f.tone+'\n\n':'')+'请扩写成完整 char 人设（故事背景务必约 1200 字）。';
    const txt=await callLLM([{role:'system',content:SYS_MAIN},{role:'user',content:userMsg}]);
    if(!txt)throw new Error('返回为空');
    if(checkBanned(txt)){bannedAlert();return;}
    _current={
      name:f.name,content:txt,form:f,time:Date.now(),
      chat:[],
      worldbook:[],worldbookPref:'',
      statusBar:{enabled:false,code:DEFAULT_STATUS_CODE}
    };
    autoArchive();
    renderResult();
    showStatus($('genStatus'),'✓ 生成成功，已自动存档','ok');
  }catch(e){showStatus($('genStatus'),'✗ '+e.message,'err');}
  finally{$('btnGen').disabled=false;$('btnGen').innerHTML='✨ 生成完整 char 设定';}
};

function autoArchive(){
  if(!_current)return;
  const arr=JSON.parse(localStorage.getItem(LS.hist)||'[]');
  if(!_current.id)_current.id=Date.now();
  const idx=arr.findIndex(x=>x.id===_current.id);
  if(idx>=0)arr[idx]=Object.assign({},_current);
  else arr.unshift(Object.assign({},_current));
  localStorage.setItem(LS.hist,JSON.stringify(arr));
}

function scrollChat(){const box=$('chatBox');if(box)box.scrollTop=box.scrollHeight;}
window.sendChat=async()=>{
  if(!_current)return;
  const msg=$('chatInput').value.trim();if(!msg)return;
  if(checkBanned(msg)){bannedAlert();return;}
  _current.chat.push({role:'user',content:msg});$('chatInput').value='';
  renderResult();showStatus($('chatStatus'),'AI 思考中…','');
  try{
    const sys='你是人设修改助手。当前 char 人设如下：\n\n===== 当前 char 人设 =====\n'+_current.content+'\n===== 结束 =====\n\n用户提出修改意见，你要：\n1. 理解用户意图；\n2. 给出具体清晰的「修改计划」——哪些板块改什么，保持其他不变；\n3. 不要现在就输出新人设全文，只说计划；\n4. 用中文。意见模糊可反问澄清。';
    const history=(_current.chat||[]).map(m=>({role:m.role==='user'?'user':'assistant',content:m.content}));
    const out=await callLLM([{role:'system',content:sys}].concat(history),{temperature:0.7});
    if(checkBanned(out)){bannedAlert();return;}
    _current.chat.push({role:'assistant',content:out,plan:true});
    autoArchive();renderResult();
    showStatus($('chatStatus'),'✓ 已给出修改计划，确认后点「应用此计划」','ok');
  }catch(e){showStatus($('chatStatus'),'✗ '+e.message,'err');}
};
window.applyChat=async()=>{
  if(!_current)return;
  showStatus($('chatStatus'),'正在应用修改…','');
  try{
    const convo=(_current.chat||[]).map(m=>(m.role==='user'?'【用户】':'【助手】')+m.content).join('\n\n');
    const sys='你是专业角色设定撰写师。基于【原人设】和【修改对话】，输出修改后的完整 char 人设。\n保留所有 ◆板块◆ 结构（基础档案/外貌速写/性格剖析/穿搭品味/衣橱/故事背景/喜好厌恶/小怪癖 & 隐藏面/语言使用规则/一句话标签），仅调整对话中商定要改的部分，其他保持。直接输出正文，不要解释、不要 markdown。';
    const user='【原人设】\n'+_current.content+'\n\n【修改对话】\n'+convo+'\n\n请输出修改后的完整人设正文。';
    const out=await callLLM([{role:'system',content:sys},{role:'user',content:user}],{temperature:0.75});
    if(!out)throw new Error('返回为空');
    if(checkBanned(out)){bannedAlert();return;}
    _current.content=out;
    _current.chat.push({role:'assistant',content:'✓ 已按上述计划应用修改。人设已更新。',plan:false});
    autoArchive();renderResult();
    showStatus($('genStatus'),'✓ 已应用修改并重新生成','ok');
  }catch(e){showStatus($('chatStatus'),'✗ '+e.message,'err');}
};

function buildExportText(it){
  let out='此内容由177QQ2782238002の生成器生成，使用请标明来源\n\n';
  out+='══════════════════════\n           '+it.name+'\n══════════════════════\n';
  out+='生成时间：'+new Date(it.time).toLocaleString('zh-CN')+'\n\n';
  out+=it.content;
  if(it.worldbookPref&&it.worldbookPref.trim()){
    out+='\n\n══════════════════════\n           🌐 世界设定偏好\n══════════════════════\n\n';
    out+=it.worldbookPref+'\n';
  }
  if(it.worldbook&&it.worldbook.length){
    out+='\n══════════════════════\n           🌐 世 界 书\n══════════════════════\n\n';
    it.worldbook.forEach((w,i)=>{
      out+='【'+(i+1)+'】'+w.title+'\n关键词：'+(w.keywords||'(无)')+'\n'+w.content+'\n\n';
    });
  }
  if(it.statusBar&&it.statusBar.enabled&&it.statusBar.code){
    out+='\n══════════════════════\n           📊 状 态 栏 规 则\n══════════════════════\n\n';
    out+=it.statusBar.code+'\n';
  }
  return out;
}

  navigator.clipboard.writeText(buildExportText(_current)).then(()=>showStatus($('genStatus'),'✓ 已复制','ok'));
};
window.exportTxt=function(it){
  const text=buildExportText(it);
  const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='177のchar生成器_'+it.name+'.txt';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);
};

  }
  if(it.worldbook&&it.worldbook.length){
    extra+='<div style="margin-top:14px;font-weight:600;color:var(--accent-d);">🌐 世界书</div>';
    extra+=it.worldbook.map(w=>'<div class="wb-item"><div class="wb-title">'+esc(w.title)+'</div><div class="wb-key">🔑 '+esc(w.keywords||'')+'</div><div class="wb-content">'+esc(w.content)+'</div></div>').join('');
  }
  if(it.statusBar&&it.statusBar.enabled){
    extra+='<div style="margin-top:14px;font-weight:600;color:var(--accent-d);">📊 状态栏（已启用）</div>';
    extra+='<div style="white-space:pre-wrap;font-size:12px;background:var(--soft);padding:8px;border-radius:8px;font-family:monospace;">'+esc(it.statusBar.code||'')+'</div>';
  }
  openModal(
    '<h3>'+esc(it.name)+'</h3>'+
    '<div class="user-card" style="max-height:50vh;overflow-y:auto;">'+esc(it.content)+'</div>'+
    extra+
    '<div class="btn-row">'+
      '<button class="ghost" onclick="closeModal()">关闭</button>'+
      '<button onclick="closeModal();exportHistById('+it.id+')">导出TXT</button>'+
      '<button onclick="closeModal();editHistContent('+it.id+')">编辑正文</button>'+
    '</div>'
  );
};
window.editHistContent=function(id){
  const arr=JSON.parse(localStorage.getItem(LS.hist)||'[]');
  const it=arr.find(x=>x.id===id);if(!it)return;
  openModal(
    '<h3>编辑 '+esc(it.name)+' 正文</h3>'+
    '<textarea id="_edit" style="min-height:300px;">'+esc(it.content)+'</textarea>'+
    '<div class="btn-row"><button class="ghost" onclick="closeModal()">取消</button><button onclick="saveHistContent('+id+')">保存</button></div>'
  );
};
window.saveHistContent=function(id){
  const arr=JSON.parse(localStorage.getItem(LS.hist)||'[]');
  const it=arr.find(x=>x.id===id);if(!it)return;
  it.content=$('_edit').value;
  localStorage.setItem(LS.hist,JSON.stringify(arr));closeModal();renderHist();
};
window.editHistName=function(id){
  const arr=JSON.parse(localStorage.getItem(LS.hist)||'[]');
  const it=arr.find(x=>x.id===id);if(!it)return;
  const n=prompt('新名称：',it.name);
  if(!n||!n.trim())return;
  it.name=n.trim();if(it.form)it.form.name=n.trim();
  localStorage.setItem(LS.hist,JSON.stringify(arr));renderHist();
};
window.exportHistById=function(id){
  const arr=JSON.parse(localStorage.getItem(LS.hist)||'[]');
  const it=arr.find(x=>x.id===id);if(it)exportTxt(it);
};
window.delHist=function(id){
  if(!confirm('删除该存档？'))return;
  let arr=JSON.parse(localStorage.getItem(LS.hist)||'[]');
  arr=arr.filter(x=>x.id!==id);
  localStorage.setItem(LS.hist,JSON.stringify(arr));renderHist();
};

/* ===== 模态 ===== */
function openModal(html){$('modalBox').innerHTML=html;$('modalMask').classList.add('show');}
window.closeModal=function(){$('modalMask').classList.remove('show');};
$('modalMask').onclick=function(e){if(e.target===$('modalMask'))closeModal();};

/* init */
loadCfg();loadPresets();renderChips();showSplash();
</script>
</body>
</html>
